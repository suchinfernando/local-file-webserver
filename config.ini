; local-file-webserver configuration
; ---------------------------------------------------------------------------
; Every option below is optional and commented out by default.
; Precedence: command-line flags override this file, which overrides built-ins.
;
; Run with a custom file:   python3 serve.py --config /path/to/config.ini
; This default file is loaded automatically when it sits next to serve.py.

; Primary directory served (the "Home" location). `~` expands to your home dir.
; If unset, your home directory is used.
; directory = ~


[server]
; Address to bind. Use 127.0.0.1 to restrict to this machine only.
; host = 0.0.0.0
; Port to listen on (0 = pick a free port).
; port = 8000
; Disable uploads, deletes, renames and mkdir.
; read_only = false
; Suppress per-request logging.
; quiet = false


[auth]
; Username for HTTP Basic auth.
; user = user
; Password. Leave empty to auto-generate one at startup.
; Use "none" (or "off"/"disabled") to disable authentication entirely.
; password =


[files]
; Hide dotfiles (names starting with ".") in listings. Toggleable in the UI.
; show_hidden = false
; Soft-delete into a .trash folder instead of erasing files.
; trash = true


[drives]
; How non-removable filesystems are exposed in the sidebar:
;   accessible -> list only home + removable drives (others hidden)
;   locked     -> list all real filesystems, non-removable ones locked  (default)
;   unlocked   -> list all and allow navigating all of them
; mode = locked
; Set to false to skip drive detection entirely (same as --no-drives).
; enabled = true
; Extra roots to expose, comma-separated absolute paths.
; roots = /srv/files, /data/shared


[trash]
; Folder name used for soft-deleted files, inside each root.
; dirname = .trash


[favorites]
; Where starred folders are stored. Defaults to
; <XDG_CONFIG_HOME>/local-file-webserver/favorites.json
; file =